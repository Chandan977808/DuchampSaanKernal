name: Build Kernel

on:
  workflow_dispatch:

env:
  CLANG_VERSION: r487747c
  DEVICE: duchamp

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # BakaSU derives its version from the commit count, so it needs full history
      - name: Unshallow BakaSU
        run: git -C KernelSU fetch --unshallow || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 zip dwarves
          pahole --version

      - name: Get clang ${{ env.CLANG_VERSION }}
        run: |
          for ref in android14-release main-kernel-build-2024 main; do
            rm -rf clang && mkdir clang
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$ref/clang-$CLANG_VERSION.tar.gz"
            curl -fsSL "$url" | tar -xz -C clang && break
          done
          clang/bin/clang --version | head -1

      - name: Build
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          MAKE="make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS=-D__ANDROID_COMMON_KERNEL__"
          $MAKE gki_defconfig
          grep -E '^(# )?CONFIG_(LTO_NONE|LTO_CLANG_THIN|LTO_CLANG_FULL)[= ]' out/.config
          grep -q '^CONFIG_LTO_CLANG_THIN=y$' out/.config || { echo "::error::ThinLTO was not enabled (check clang, lld and llvm tools)"; exit 1; }
          $MAKE -j"$(nproc)" Image 2>&1 | tee build.log
          test -f out/arch/arm64/boot/Image || { echo "::error::Image was not produced"; exit 1; }
          echo "ZIP_NAME=$($MAKE -s kernelrelease)-$DEVICE-$(date +%Y%m%d).zip" >> "$GITHUB_ENV"

      - name: Show first errors
        if: failure()
        run: grep -n -m 30 -E 'error:|\*\*\*|BTF:|undefined|No such file|not available' build.log || tail -50 build.log

      - name: Package (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          # Use our own anykernel.sh instead of the AnyKernel3 default
          test -s "$GITHUB_WORKSPACE/anykernel/anykernel.sh"
          cp "$GITHUB_WORKSPACE/anykernel/anykernel.sh" anykernel.sh
          zip -r9 "../$ZIP_NAME" . -x ".git*" "README.md" "*placeholder"

      # archive: false uploads the flashable zip as-is (no zip inside a zip)
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-log
          path: build.log
